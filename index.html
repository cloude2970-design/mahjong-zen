  <style>
    :root {
      --t-w: 62px;
      --t-h: 84px;

      --ivory: #f5f5f4;

    body {

      background: var(--zen-bg);
      font-family: "Palatino", serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;

    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #292524;
      background: rgba(0,0,0,0.4);
    }
    .zen-title {
      font-size: 24px;
      font-weight: 200;
      letter-spacing: 10px;
      color: #fafaf9;
    }
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 30px;
      font-size: 11px;
      letter-spacing: 4px;
      margin-top: 8px;
    }
    .stats-bar span {
      color: #d97706;
    }
    #game-area {
      position: relative;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }
    #board {
      position: relative;
      width: 400px;
      height: 500px;
      transform: rotateX(10deg);
      transform-style: preserve-3d;
    }
    .tile {
      position: absolute;
      width: var(--t-w);
      height: var(--t-h);
      background: var(--ivory);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: 1.5px solid #1c1917;
      box-shadow: 0 1px 0 #d6d3d1, 1px 2px 0 #d6d3d1, 2px 3px 0 #78716c, 4px 10px 25px rgba(0,0,0,0.8);
      transition: all 0.3s ease;
    }
    .tile .symbol {
      font-size: 56px;
      line-height: 0;
      user-select: none;
      filter: grayscale(1) brightness(0) contrast(1000%);
      opacity: 0.85;
      transform: translateY(-4px);
      display: inline-block;
    }
    .tile.selected {
      background: #fff;
      transform: translateZ(30px) scale(1.05);
      box-shadow: 0 20px 50px rgba(217,119,6,0.3);
      border-color: var(--gold);
    }
    .tile.locked {
      filter: contrast(0.5) brightness(0.2);
      cursor: not-allowed;
      opacity: 0.4;
    }
    .tile.hint {
      outline: 4px solid var(--gold);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.5; }

    #onboarding-overlay, #leaderboard-overlay, #name-input-overlay {

<body>
  <div id="onboarding-overlay">

  <div id="leaderboard-overlay">

      <div id="leaderboard-list" class="leaderboard-list"></div>
      <button class="zen-btn" onclick="closeLeaderboard()" style="margin-top:20px;">CLOSE</button>
    </div>
  </div>

  <header>
    <div class="zen-title">MAHJONG ZEN</div>
    <div class="stats-bar">
      <div>REMAINING: <span id="count">0</span></div>
      <div>TIME: <span id="timer">00:00</span></div>
    </div>
  </header>

  <div id="game-area"><div id="board"></div></div>

  <footer>
    <button class="zen-btn" onclick="undo()">UNDO</button>
    <button class="zen-btn" onclick="showHint()">HINT</button>
    <button class="zen-btn" onclick="init()">RESET</button>
    <button class="zen-btn" onclick="showLeaderboard()" style="border-color:var(--gold);">RANK</button>
    <button class="zen-btn" id="noiseBtn" onclick="toggleNoise()">🌧 RAIN</button>
    <button class="zen-btn" onclick="shareGame()" style="border-color:#ff0050;color:#ff0050;">📤 分享</button>
  </footer>

  <script>
    const board = document.getElementById('board');
    const countEl = document.getElementById('count');
    const timerEl = document.getElementById('timer');
    const overlay = document.getElementById('onboarding-overlay');
    const nameInputOverlay = document.getElementById('name-input-overlay');
    const leaderboardOverlay = document.getElementById('leaderboard-overlay');
    const mahjongs = ['🀄','🀅','🀆','🀇','🀈','🀉','🀊','🀋','🀌','🀝','🀞','🀟','🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀙','🀚','🀛'];
    
    let selected = null;
    let all = [];
    let history = [];
    let audioCtx = null;
    let startTime = null;
    let timerInterval = null;
    let currentGameTime = 0;

    function initAudio() {
      if(!audioCtx) audioCtx = new(window.AudioContext||window.webkitAudioContext)();
    }

    // Google Analytics 事件追踪
    function trackEvent(action, params = {}) {
      if(typeof gtag !== 'undefined') {
        gtag('event', action, params);
      }
    }

    function playZenSound(f, type="sine", d=0.5, v=0.02) {
      initAudio();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, audioCtx.currentTime);
      g.gain.setValueAtTime(v, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + d);
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startTimer() {
      startTime = Date.now();
      trackEvent('game_start');
      timerInterval = setInterval(() => {
        currentGameTime = Math.floor((Date.now() - startTime) / 1000);
        timerEl.textContent = formatTime(currentGameTime);
      }, 1000);
    }

    function stopTimer() {
      if(timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function isLocked(t) {
      const {r,c,l} = t.dataset;
      const up = all.some(o => o.dataset.l > l && Math.abs(o.dataset.r-r)<0.7 && Math.abs(o.dataset.c-c)<0.7);
      if(up) return true;
      const left = all.some(o => o.dataset.l == l && Math.abs(o.dataset.r-r)<0.5 && o.dataset.c < c && o.dataset.c > c-1.1);
      const right = all.some(o => o.dataset.l == l && Math.abs(o.dataset.r-r)<0.5 && o.dataset.c > c && o.dataset.c < c+1.1);
      return left && right;
    }

    function hasAvailableMoves() {
      const free = all.filter(t => !isLocked(t));
      for(let i=0; i<free.length; i++)
        for(let j=i+1; j<free.length; j++)
          if(free[i].dataset.v === free[j].dataset.v) return true;
      return false;
    }

    function reshuffle() {
      if(all.length === 0) return;
      playZenSound(200, "triangle", 1);
      let pool = all.map(t => t.dataset.v).sort(() => Math.random() - 0.5);
      all.forEach((t, i) => {
        t.dataset.v = pool[i];
        t.querySelector('.symbol').innerText = pool[i];
      });
      if(!hasAvailableMoves()) reshuffle();
      refresh();
    }

    function showSuccessOverlay() {
      stopTimer();
      playZenSound(800, "triangle", 1.5, 0.05);
      trackEvent('game_complete', {
        'time_seconds': currentGameTime,
        'time_formatted': formatTime(currentGameTime)
      });
      document.getElementById('final-time-display').textContent = formatTime(currentGameTime);
      nameInputOverlay.style.display = 'flex';
      document.getElementById('player-name').value = localStorage.getItem('zenPlayerName') || '';
      document.getElementById('player-name').focus();
    }

    function saveScore() {
      const name = document.getElementById('player-name').value.trim() || 'Anonymous';
      localStorage.setItem('zenPlayerName', name);
      
      trackEvent('score_save', {
        'player_name': name,
        'time_seconds': currentGameTime
      });
      
      const scores = JSON.parse(localStorage.getItem('zenLeaderboard') || '[]');
      scores.push({
        name: name,
        time: currentGameTime,
        date: new Date().toLocaleDateString(),
        timestamp: Date.now()
      });
      scores.sort((a, b) => a.time - b.time);
      localStorage.setItem('zenLeaderboard', JSON.stringify(scores.slice(0, 10)));
      
      nameInputOverlay.style.display = 'none';
      showLeaderboard();
    }

    function skipScoreSave() {
      nameInputOverlay.style.display = 'none';
      location.reload();
    }

    function showLeaderboard() {
      trackEvent('leaderboard_view');
      const scores = JSON.parse(localStorage.getItem('zenLeaderboard') || '[]');
      const listEl = document.getElementById('leaderboard-list');
      
      if(scores.length === 0) {
        listEl.innerHTML = '<div class="no-scores">No records yet. Be the first!</div>';
      } else {
        listEl.innerHTML = scores.map((s, i) => `
          <div class="leaderboard-item">
            <span class="rank">#${i + 1}</span>
            <span class="name">${s.name}</span>
            <span class="time">${formatTime(s.time)}</span>
            <span class="date">${s.date}</span>
          </div>
        `).join('');
      }
      
      leaderboardOverlay.style.display = 'flex';
    }

    function closeLeaderboard() {
      leaderboardOverlay.style.display = 'none';
      if(all.length === 0) location.reload();
    }

    function refresh() {
      all.forEach(t => {
        t.classList.remove('hint');
        t.classList.toggle('locked', isLocked(t));
      });
      countEl.innerText = all.length;
      if(all.length === 0) showSuccessOverlay();
      else if(!hasAvailableMoves()) setTimeout(() => { alert("No moves left. Reshuffling..."); reshuffle(); }, 500);
    }

    function handle(t) {
      if(t.classList.contains('locked')) return;
      initAudio();
      if(selected === t) {
        t.classList.remove('selected');
        selected = null;
        return;
      }
      playZenSound(selected ? 600 : 400);
      if(selected) {
        if(selected.dataset.v === t.dataset.v) {
          history.push([selected, t]);
          t.remove();
          selected.remove();
          all = all.filter(x => x!==t && x!==selected);
          selected = null;
          playZenSound(800, "triangle", 1.2, 0.03);
          refresh();
        } else {
          selected.classList.remove('selected');
          t.classList.add('selected');
          selected = t;
        }
      } else {
        t.classList.add('selected');
        selected = t;
      }
    }

    function skipAll() {
      localStorage.setItem('zenDone', '1');
      overlay.style.display = 'none';
      startTimer();
    }

    function showHint() {
      trackEvent('hint_used');
      const free = all.filter(t => !isLocked(t));
      for(let i=0; i<free.length; i++)
        for(let j=i+1; j<free.length; j++)
          if(free[i].dataset.v === free[j].dataset.v) {
            free[i].classList.add('hint');
            free[j].classList.add('hint');
            return;
          }
    }

    function undo() {
      if(!history.length) return;
      trackEvent('undo_used');
      const last = history.pop();
      last.forEach(t => {
        board.appendChild(t);
        all.push(t);
      });
      refresh();
    }

    function init() {
      stopTimer();
      board.innerHTML = '';
      all = [];
      history = [];
      currentGameTime = 0;
      timerEl.textContent = '00:00';
      
      const layout = [];
      for(let r=0;r<6;r++) for(let c=0;c<4;c++) layout.push({r,c,l:0});
      for(let r=1;r<5;r++) for(let c=1;c<3;c++) layout.push({r:r+0.2,c:c+0.2,l:1});
      for(let r=2;r<4;r++) layout.push({r:r+0.4,c:1.7,l:2});
      let pool = [];
      let n = Math.floor(layout.length/2);
      for(let i=0; i<n; i++) {
        const v = mahjongs[i % mahjongs.length];
        pool.push(v,v);
      }
      if(layout.length % 2) pool.push(mahjongs[0]);
      pool.sort(() => Math.random() - 0.5);
      layout.forEach((p, i) => {
        const t = document.createElement('div');
        t.className = 'tile';
        t.innerHTML = `<span class="symbol">${pool[i]}</span>`;
        Object.assign(t.dataset, {v:pool[i], r:p.r, c:p.c, l:p.l});
        t.style.left = `${p.c * 72 + 50}px`;
        t.style.top = `${p.r * 78 + 30}px`;
        t.style.transform = `translateZ(${p.l * 12}px)`;
        t.style.zIndex = p.l * 10;
        t.onclick = () => handle(t);
        board.appendChild(t);
        all.push(t);
      });
      if(!hasAvailableMoves()) init();
      refresh();
      
      if(!localStorage.getItem('zenDone')) {
        overlay.style.display = 'flex';
      } else {
        startTimer();
      }
      document.getElementById('next-step').onclick = () => skipAll();
    }

    // White/Brown Noise Generator
    let noiseNode = null;
    let noiseGain = null;
    let isNoiseOn = false;

    function createBrownNoise() {
      const bufferSize = 2 * audioCtx.sampleRate;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      let lastOut = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        output[i] = (lastOut + (0.02 * white)) / 1.02;
        lastOut = output[i];
        output[i] *= 3.5;
      }
      return buffer;
    }

    function toggleNoise() {
      initAudio();
      const btn = document.getElementById('noiseBtn');
      
      if (isNoiseOn) {
        // Turn off
        trackEvent('rain_toggle', { 'state': 'off' });
        if (noiseGain) {
          noiseGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2);
          setTimeout(() => {
            if (noiseNode) { noiseNode.stop(); noiseNode = null; }
            if (noiseGain) { noiseGain.disconnect(); noiseGain = null; }
          }, 2000);
        }
        btn.textContent = '🌧 RAIN';
        btn.style.borderColor = '#444';
        btn.style.color = '#78716c';
        isNoiseOn = false;
      } else {
        // Turn on - create brown noise (softer than white noise)
        trackEvent('rain_toggle', { 'state': 'on' });
        const buffer = createBrownNoise();
        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buffer;
        noiseNode.loop = true;
        
        // Lowpass filter to make it more soothing
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        
        noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0;
        
        noiseNode.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        
        noiseNode.start();
        noiseGain.gain.exponentialRampToValueAtTime(0.03, audioCtx.currentTime + 3);
        
        btn.textContent = '◼ STOP';
        btn.style.borderColor = 'var(--gold)';
        btn.style.color = 'var(--gold)';
        isNoiseOn = true;
      }
    }

    // Close overlays on escape key
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') {
        nameInputOverlay.style.display = 'none';
        leaderboardOverlay.style.display = 'none';
      }
    });

    // 分享功能（支持 TikTok、微信、系统分享）
    function shareGame() {
      const shareData = {
        title: 'Mahjong Zen - 禅意麻将消消乐',
        text: '发现一款超治愈的麻将配对游戏，白噪音+极简美学，适合减压冥想！',
        url: 'https://cloude2970-design.github.io/mahjong-zen/'
      };
      
      // 优先使用系统原生分享（TikTok 内浏览器支持）
      if (navigator.share) {
        navigator.share(shareData)
          .then(() => trackEvent('share_success', { 'method': 'native' }))
          .catch((err) => {
            if (err.name !== 'AbortError') {
              console.log('分享失败:', err);
              fallbackShare();
            }
          });
      } else {
        fallbackShare();
      }
    }
    
    // 降级分享方案
    function fallbackShare() {
      const shareUrl = 'https://cloude2970-design.github.io/mahjong-zen/';
      const shareText = '发现一款超治愈的麻将配对游戏，白噪音+极简美学，适合减压冥想！';
      
      // 检测是否在 TikTok/抖音内
      const isTikTok = /tiktok|douyin|aweme/i.test(navigator.userAgent);
      
      if (isTikTok) {
        alert('点击右上角「···」，选择「复制链接」分享给朋友！');
        trackEvent('share_prompt', { 'method': 'tiktok_manual' });
      } else {
        // 复制到剪贴板
        const fullText = `${shareText} ${shareUrl}`;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(fullText).then(() => {
            alert('链接已复制，快去分享给朋友吧！');
            trackEvent('share_success', { 'method': 'clipboard' });
          });
        } else {
          alert(`请手动复制分享：\n${fullText}`);
          trackEvent('share_prompt', { 'method': 'manual' });
        }
      }
    }

    // 注册 Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW 注册成功:', reg.scope))
        .catch(err => console.log('SW 注册失败:', err));
    }

    init();
  </script>
</body>
</html>
